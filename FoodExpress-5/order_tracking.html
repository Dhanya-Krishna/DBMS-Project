<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Tracking - FoodExpress</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg">
    <div class="container">
      <a class="navbar-brand" href="home.html">
        <span class="logo-icon"><i class="bi bi-basket2-fill"></i></span>
        FoodExpress
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-1">
          <li class="nav-item"><a class="nav-link" href="home.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="restaurants.html">Restaurants</a></li>
          <li class="nav-item"><a class="nav-link active" href="order_tracking.html">Orders</a></li>
          <li class="nav-item">
            <a class="nav-link cart-badge" href="cart.html">
              <i class="bi bi-cart3"></i> Cart
              <span class="badge rounded-pill cart-count">0</span>
            </a>
          </li>
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">
              <i class="bi bi-person-circle"></i> <span class="user-name">User</span>
            </a>
            <ul class="dropdown-menu dropdown-menu-end">
              <li><a class="dropdown-item" href="profile.html">Profile</a></li>
              <li><a class="dropdown-item" href="index.html">Logout</a></li>
            </ul>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="page-header page-header-track">
    <div class="container">
      <h1><i class="bi bi-geo-alt"></i> Track Your Order</h1>
    </div>
  </div>

  <div class="container pb-5">
    <div class="row justify-content-center">
      <div class="col-lg-8" id="orderTrackWrap">
        <div class="text-center py-5 bg-white rounded-3 shadow-sm">
          <div class="spinner-border text-primary" role="status"></div>
          <p class="mt-3 text-muted">Loading order details from database...</p>
        </div>
      </div>
    </div>
  </div>

  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">&copy; 2026 FoodExpress. All rights reserved.</div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/script.js"></script>
  <script src="js/db.js"></script>
  <script>
    (async function () {
      const wrap = document.getElementById('orderTrackWrap');

      async function waitClient() {
        for (let i = 0; i < 30 && !window.supabaseClient; i++) {
          await new Promise(r => setTimeout(r, 100));
        }
      }

      function formatTime(iso) {
        if (!iso) return 'Just now';
        try {
          return new Date(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) +
                 ' • ' + new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        } catch { return 'Recently'; }
      }

      function getStatusPill(status) {
        const s = (status || '').toLowerCase();
        if (s.includes('deliver') && !s.includes('out')) {
          return '<span class="status-badge status-delivered"><i class="bi bi-check-circle-fill me-1"></i> Delivered</span>';
        }
        if (s.includes('out')) {
          return '<span class="status-badge bg-warning text-dark"><i class="bi bi-bicycle me-1"></i> Out for Delivery</span>';
        }
        if (s.includes('ready')) {
          return '<span class="status-badge bg-info text-dark"><i class="bi bi-bag-check me-1"></i> Ready for Pickup</span>';
        }
        if (s.includes('prepar')) {
          return '<span class="status-badge status-preparing"><i class="bi bi-fire me-1"></i> Preparing</span>';
        }
        return '<span class="status-badge status-preparing"><i class="bi bi-clock-history me-1"></i> Placed</span>';
      }

      async function loadOrder() {
        await waitClient();

        const params = new URLSearchParams(window.location.search);
        let targetId = params.get('order') || localStorage.getItem('foodexpress_last_order');

        let user = {};
        try { user = JSON.parse(localStorage.getItem('foodexpress_user') || '{}'); } catch {}

        // If no targetId, try fetching latest order for logged in customer
        if (!targetId && user.email && window.DB) {
          const cust = await DB.findCustomerByEmail(user.email);
          if (cust) {
            const custOrders = await DB.getCustomerOrders(cust.customerid);
            if (custOrders && custOrders.length) {
              targetId = custOrders[0].orderid;
            }
          }
        }

        if (!targetId) {
          wrap.innerHTML = `
            <div class="empty-state bg-white rounded-3 p-5 shadow-sm text-center">
              <i class="bi bi-bag-x fs-1 text-muted"></i>
              <h5 class="mt-3">No Order Found</h5>
              <p class="text-muted">You haven't placed any orders yet.</p>
              <a href="restaurants.html" class="btn btn-primary-custom">Browse Restaurants</a>
            </div>`;
          return;
        }

        try {
          const order = await DB.getOrderDetails(targetId);
          if (!order) {
            wrap.innerHTML = `
              <div class="empty-state bg-white rounded-3 p-5 shadow-sm text-center">
                <i class="bi bi-search fs-1 text-muted"></i>
                <h5 class="mt-3">Order #${targetId} Not Found</h5>
                <p class="text-muted">Could not retrieve order details from database.</p>
                <a href="home.html" class="btn btn-primary-custom">Back to Home</a>
              </div>`;
            return;
          }

          const s = (order.status || 'Placed').toLowerCase();
          const restName = order.restaurant ? order.restaurant.name : 'Restaurant';
          const items = order.orderitem || [];

          // Step status flags
          const step1Class = 'completed';
          const step2Class = (s !== 'placed' && s !== 'new') ? 'completed' : 'active';
          const step3Class = (s.includes('prepar') || s.includes('ready')) ? 'active' : ((s.includes('out') || s.includes('deliver')) ? 'completed' : '');
          const step4Class = s.includes('out') ? 'active' : (s.includes('deliver') && !s.includes('out') ? 'completed' : '');
          const step5Class = (s.includes('deliver') && !s.includes('out')) ? 'completed active' : '';

          let itemsHtml = '';
          items.forEach(it => {
            const name = it.menuitem ? it.menuitem.name : 'Item';
            const price = it.subtotal || (it.unitprice * it.quantity);
            itemsHtml += `
              <div class="d-flex justify-content-between mb-2 small fw-semibold">
                <span>${name} × ${it.quantity}</span>
                <span>₹${price}</span>
              </div>`;
          });

          const addr = order.address
            ? `${order.address.street || ''}, ${order.address.city || ''} ${order.address.pincode ? '- ' + order.address.pincode : ''}`
            : 'Saved Address';

          const partner = order.deliverypartner;
          let partnerHtml = '';
          if (partner) {
            const initial = (partner.name || 'P').charAt(0).toUpperCase();
            partnerHtml = `
              <div class="checkout-section">
                <h5 class="fw-bold mb-3"><i class="bi bi-bicycle text-primary me-2"></i> Delivery Partner</h5>
                <div class="d-flex align-items-center gap-3">
                  <div class="profile-avatar bg-primary text-white d-flex align-items-center justify-content-center rounded-circle" style="width:50px;height:50px;font-size:1.2rem;font-weight:bold;">${initial}</div>
                  <div>
                    <h6 class="mb-0 fw-bold">${partner.name}</h6>
                    <p class="small text-muted mb-0"><i class="bi bi-star-fill text-warning me-1"></i> ${partner.rating || 4.8} Rating</p>
                  </div>
                  <a href="tel:${partner.phone || ''}" class="btn btn-outline-custom btn-sm ms-auto">
                    <i class="bi bi-telephone me-1"></i> Call
                  </a>
                </div>
              </div>`;
          } else {
            partnerHtml = `
              <div class="checkout-section">
                <h5 class="fw-bold mb-3"><i class="bi bi-bicycle text-primary me-2"></i> Delivery Partner</h5>
                <div class="d-flex align-items-center gap-3">
                  <div class="profile-avatar bg-light text-muted d-flex align-items-center justify-content-center rounded-circle border" style="width:50px;height:50px;font-size:1.2rem;"><i class="bi bi-clock"></i></div>
                  <div>
                    <h6 class="mb-0 fw-semibold text-muted">Assigning partner...</h6>
                    <p class="small text-muted mb-0">A delivery driver will accept your order soon</p>
                  </div>
                </div>
              </div>`;
          }

          const grandTotal = (parseFloat(order.subtotal) || 0) + (parseFloat(order.deliveryfee) || 40);

          wrap.innerHTML = `
            <div class="checkout-section mb-4">
              <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
                <div>
                  <h5 class="fw-bold mb-1">Order #${order.orderid}</h5>
                  <p class="text-muted small mb-0"><i class="bi bi-calendar-event me-1"></i> Placed on ${formatTime(order.orderdatetime)}</p>
                </div>
                <div>${getStatusPill(order.status)}</div>
              </div>

              <div class="tracking-timeline">
                <div class="tracking-step ${step1Class}">
                  <h6>Order Confirmed</h6>
                  <p>Received by ${restName}</p>
                </div>
                <div class="tracking-step ${step2Class}">
                  <h6>Restaurant Accepted</h6>
                  <p>${restName} has confirmed your order</p>
                </div>
                <div class="tracking-step ${step3Class}">
                  <h6>Preparing Your Food</h6>
                  <p>Freshly cooking your meal</p>
                </div>
                <div class="tracking-step ${step4Class}">
                  <h6>Out for Delivery</h6>
                  <p>Delivery partner is on the way</p>
                </div>
                <div class="tracking-step ${step5Class}">
                  <h6>Delivered</h6>
                  <p>Order complete. Enjoy your food!</p>
                </div>
              </div>
            </div>

            <div class="checkout-section mb-4">
              <h5 class="fw-bold mb-3"><i class="bi bi-receipt text-primary me-2"></i> Order Details</h5>
              ${itemsHtml || '<p class="text-muted small">Items loaded from database</p>'}
              <hr>
              <div class="d-flex justify-content-between small text-muted mb-1">
                <span>Subtotal</span>
                <span>₹${order.subtotal || 0}</span>
              </div>
              <div class="d-flex justify-content-between small text-muted mb-2">
                <span>Delivery Fee</span>
                <span>₹${order.deliveryfee || 40}</span>
              </div>
              <div class="d-flex justify-content-between fw-bold fs-6 text-dark border-top pt-2">
                <span>Total Paid</span>
                <span class="text-primary">₹${grandTotal}</span>
              </div>
              <p class="small text-muted mt-3 mb-0"><i class="bi bi-geo-alt-fill text-danger me-1"></i> <strong>Delivery to:</strong> ${addr}</p>
            </div>

            ${partnerHtml}

            <div class="text-center mt-4">
              <a href="home.html" class="btn btn-primary-custom px-4"><i class="bi bi-house-door me-1"></i> Back to Home</a>
            </div>`;
        } catch (err) {
          console.error(err);
          wrap.innerHTML = `
            <div class="alert alert-danger">
              Failed to load order tracking data: ${err.message || err}
            </div>`;
        }
      }

      loadOrder();
      // Live polling every 10 seconds for real-time order status updates
      setInterval(loadOrder, 10000);
    })();
  </script>
</body>
</html>
