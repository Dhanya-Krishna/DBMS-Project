<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu - FoodExpress</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <style>
    .menu-img-real {
      height: 180px;
      object-fit: cover;
      width: 100%;
      display: block;
    }
    .menu-card .menu-body { padding: 1rem; }
    .filter-chip { user-select: none; cursor: pointer; }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg">
    <div class="container">
      <a class="navbar-brand" href="home.html">
        <span class="logo-icon"><i class="bi bi-basket2-fill"></i></span>
        FoodExpress
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-1">
          <li class="nav-item"><a class="nav-link" href="home.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="restaurants.html">Restaurants</a></li>
          <li class="nav-item">
            <a class="nav-link cart-badge" href="cart.html">
              <i class="bi bi-cart3"></i> Cart
              <span class="badge rounded-pill cart-count">0</span>
            </a>
          </li>
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">
              <i class="bi bi-person-circle"></i> <span class="user-name">User</span>
            </a>
            <ul class="dropdown-menu dropdown-menu-end">
              <li><a class="dropdown-item" href="profile.html">Profile</a></li>
              <li><a class="dropdown-item" href="index.html">Logout</a></li>
            </ul>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="page-header page-header-menu" id="restaurantHeader">
    <div class="container">
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb mb-2" style="--bs-breadcrumb-divider-color: rgba(255,255,255,0.5);">
          <li class="breadcrumb-item"><a href="restaurants.html" class="text-white opacity-75">Restaurants</a></li>
          <li class="breadcrumb-item active text-white" id="breadcrumbName" aria-current="page">Restaurant</li>
        </ol>
      </nav>
      <div class="d-flex flex-wrap align-items-center gap-3">
        <div>
          <h1 class="mb-1" id="restName">Restaurant</h1>
          <p class="mb-0 opacity-90" id="restCuisine">Cuisine</p>
        </div>
        <div class="ms-auto d-flex gap-3 align-items-center flex-wrap">
          <span class="rating-badge fs-6" id="restRating"><i class="bi bi-star-fill"></i> 4.5</span>
          <span class="text-white" id="restTime"><i class="bi bi-clock"></i> 30 mins</span>
          <span class="text-white" id="restCost"><i class="bi bi-currency-rupee"></i> 200 for two</span>
        </div>
      </div>
    </div>
  </div>

  <div class="container pb-5">
    <div class="filter-bar mb-4" id="categoryFilters"></div>
    <div class="row g-4" id="menuGrid"></div>
    <div id="noResults" class="empty-state d-none">
      <i class="bi bi-search"></i>
      <h5>No dishes found</h5>
      <p class="text-muted">Try another category</p>
    </div>
  </div>

  <a href="cart.html" class="btn btn-primary-custom position-fixed bottom-0 end-0 m-4 rounded-pill shadow d-flex align-items-center gap-2" style="z-index:100;">
    <i class="bi bi-cart3"></i> View Cart
    <span class="badge bg-white text-primary cart-count">0</span>
  </a>

  
  <!-- Item Detail Modal -->
  <div class="item-modal-overlay" id="itemModal" role="dialog" aria-modal="true">
    <div class="item-modal">
      <div class="item-modal-img-wrap">
        <button type="button" class="item-modal-close" id="itemModalClose" aria-label="Close">&times;</button>
        <img src="" alt="" class="item-modal-img" id="modalImg">
      </div>
      <div class="item-modal-body">
        <h4 class="fw-bold mb-1" id="modalName"></h4>
        <p class="text-muted small mb-2" id="modalCategory"></p>
        <p class="mb-3" id="modalDesc"></p>
        <div class="d-flex justify-content-between align-items-center">
          <span class="item-modal-price" id="modalPrice"></span>
          <span id="modalVeg"></span>
        </div>
        <div class="item-modal-actions">
          <button type="button" class="btn btn-primary-custom flex-grow-1" id="modalAddCart">
            <i class="bi bi-cart-plus"></i> Add to Cart
          </button>
          <button type="button" class="btn btn-outline-custom" id="modalCloseBtn">Close</button>
        </div>
      </div>
    </div>
  </div>

  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">&copy; 2026 FoodExpress. All rights reserved.</div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/data.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/script.js"></script>
  <script src="js/db.js"></script>
  <script>
    (async function () {
      const params = new URLSearchParams(window.location.search);
      const restId = params.get('id') || '1';
      let restaurant = null;
      let menuItems = [];

      async function waitClient() {
        for (let i = 0; i < 30 && !window.supabaseClient; i++) {
          await new Promise(r => setTimeout(r, 100));
        }
        if (!window.supabaseClient) throw new Error('Supabase not ready');
      }

      async function load() {
        const grid = document.getElementById('menuGrid');
        if (grid) grid.innerHTML = '<div class="col-12 text-center py-4"><div class="spinner-border text-warning"></div><p>Loading menu from database...</p></div>';

        await waitClient();
        restaurant = await DB.getRestaurant(restId);
        menuItems = await DB.getMenuItems(restId);

        if (restaurant) {
          const nameEl = document.getElementById('restName');
          const cuisineEl = document.getElementById('restCuisine');
          const breadcrumb = document.getElementById('breadcrumbName');
          const ratingEl = document.getElementById('restRating');
          if (nameEl) nameEl.textContent = restaurant.name;
          if (cuisineEl) cuisineEl.textContent = restaurant.address || '';
          if (breadcrumb) breadcrumb.textContent = restaurant.name;
          if (ratingEl) ratingEl.innerHTML = '<i class="bi bi-star-fill"></i> ' + (restaurant.rating || '4.0');
        }

        renderMenu(menuItems);
      }

      function renderMenu(items) {
        const grid = document.getElementById('menuGrid');
        if (!grid) return;
        if (!items || items.length === 0) {
          grid.innerHTML = '<div class="col-12 text-center text-muted">No menu items found in database</div>';
          return;
        }

        function renderCardAction(item) {
          const cartItems = window.Cart ? Cart.getItems() : [];
          const inCart = cartItems.find(i => String(i.id) === String(item.itemid));
          const qty = inCart ? inCart.qty : 0;
          const nameEsc = (item.name || '').replace(/"/g, '&quot;');
          const restEsc = (restaurant ? restaurant.name : '').replace(/"/g, '&quot;');

          if (qty > 0) {
            return '<div class="d-flex align-items-center bg-white rounded-pill px-2 py-1 border border-primary shadow-sm" style="height:32px;">' +
              '<button class="btn btn-sm text-primary p-0 border-0 fw-bold btn-card-dec" data-id="' + item.itemid + '" style="width:24px;height:24px;line-height:1;font-size:16px;">−</button>' +
              '<span class="fw-bold px-2 text-primary small" style="min-width:20px;text-align:center;">' + qty + '</span>' +
              '<button class="btn btn-sm text-primary p-0 border-0 fw-bold btn-card-inc" ' +
                'data-id="' + item.itemid + '" ' +
                'data-name="' + nameEsc + '" ' +
                'data-price="' + item.price + '" ' +
                'data-image="' + (item.imageurl || '') + '" ' +
                'data-restaurant="' + restEsc + '" style="width:24px;height:24px;line-height:1;font-size:16px;">+</button>' +
            '</div>';
          }

          return '<button class="btn btn-primary-custom btn-sm btn-add-cart" ' +
            'data-id="' + item.itemid + '" ' +
            'data-name="' + nameEsc + '" ' +
            'data-price="' + item.price + '" ' +
            'data-image="' + (item.imageurl || '') + '" ' +
            'data-restaurant="' + restEsc + '">' +
            '<i class="bi bi-plus"></i> Add</button>';
        }

        grid.innerHTML = items.map(item => {
          const veg = item.isveg ? '<span class="text-success" title="Veg">●</span>' : '<span class="text-danger" title="Non-veg">●</span>';
          const img = item.imageurl
            ? '<img src="' + item.imageurl + '" alt="' + item.name + '" class="menu-img-real" style="height:160px;width:100%;object-fit:cover;" onerror="this.style.display=\'none\'">'
            : '';
          return '<div class="col-md-6 col-lg-4">' +
            '<div class="menu-card h-100">' +
              img +
              '<div class="menu-body p-3">' +
                '<div class="d-flex justify-content-between align-items-start mb-1">' +
                  '<h6 class="fw-bold mb-0">' + veg + ' ' + item.name + '</h6>' +
                  '<span class="fw-bold text-primary">₹' + item.price + '</span>' +
                '</div>' +
                '<p class="small text-muted mb-2">' + (item.description || '') + '</p>' +
                '<div class="d-flex justify-content-between align-items-center">' +
                  '<span class="badge bg-light text-dark">' + (item.category || '') + '</span>' +
                  '<div>' + renderCardAction(item) + '</div>' +
                '</div>' +
              '</div>' +
            '</div>' +
          '</div>';
        }).join('');

        grid.querySelectorAll('.btn-add-cart, .btn-card-inc').forEach(btn => {
          btn.addEventListener('click', function (e) {
            e.preventDefault();
            e.stopPropagation();
            if (!window.Cart) return;
            const itemId = String(this.dataset.id);
            const itemsInCart = Cart.getItems();
            const existing = itemsInCart.find(i => String(i.id) === itemId);
            if (existing) {
              Cart.updateQty(itemId, existing.qty + 1);
            } else {
              Cart.addItem({
                id: itemId,
                name: this.dataset.name,
                price: parseFloat(this.dataset.price),
                image: this.dataset.image || '',
                restaurant: this.dataset.restaurant || '',
                qty: 1
              });
            }
            renderMenu(menuItems);
          });
        });

        grid.querySelectorAll('.btn-card-dec').forEach(btn => {
          btn.addEventListener('click', function (e) {
            e.preventDefault();
            e.stopPropagation();
            if (!window.Cart) return;
            const itemId = String(this.dataset.id);
            const itemsInCart = Cart.getItems();
            const existing = itemsInCart.find(i => String(i.id) === itemId);
            if (existing) {
              Cart.updateQty(itemId, existing.qty - 1);
            }
            renderMenu(menuItems);
          });
        });
      }

      window.addEventListener('cartUpdated', () => {
        if (menuItems && menuItems.length) renderMenu(menuItems);
      });

      load().catch(err => {
        console.error(err);
        const grid = document.getElementById('menuGrid');
        if (grid) grid.innerHTML = '<div class="col-12 text-center text-danger">Failed to load menu: ' + err.message + '</div>';
      });
    })();
  </script>
</body>
</html>
