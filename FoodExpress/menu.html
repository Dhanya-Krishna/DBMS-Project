<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu - FoodExpress</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <style>
    .menu-img-real {
      height: 180px;
      object-fit: cover;
      width: 100%;
      display: block;
    }
    .menu-card .menu-body { padding: 1rem; }
    .filter-chip { user-select: none; cursor: pointer; }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg">
    <div class="container">
      <a class="navbar-brand" href="home.html">
        <span class="logo-icon"><i class="bi bi-basket2-fill"></i></span>
        FoodExpress
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-1">
          <li class="nav-item"><a class="nav-link" href="home.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="restaurants.html">Restaurants</a></li>
          <li class="nav-item">
            <a class="nav-link cart-badge" href="cart.html">
              <i class="bi bi-cart3"></i> Cart
              <span class="badge rounded-pill cart-count">0</span>
            </a>
          </li>
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">
              <i class="bi bi-person-circle"></i> <span class="user-name">User</span>
            </a>
            <ul class="dropdown-menu dropdown-menu-end">
              <li><a class="dropdown-item" href="profile.html">Profile</a></li>
              <li><a class="dropdown-item" href="index.html">Logout</a></li>
            </ul>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="page-header" id="restaurantHeader">
    <div class="container">
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb mb-2" style="--bs-breadcrumb-divider-color: rgba(255,255,255,0.5);">
          <li class="breadcrumb-item"><a href="restaurants.html" class="text-white opacity-75">Restaurants</a></li>
          <li class="breadcrumb-item active text-white" id="breadcrumbName" aria-current="page">Restaurant</li>
        </ol>
      </nav>
      <div class="d-flex flex-wrap align-items-center gap-3">
        <div>
          <h1 class="mb-1" id="restName">Restaurant</h1>
          <p class="mb-0 opacity-90" id="restCuisine">Cuisine</p>
        </div>
        <div class="ms-auto d-flex gap-3 align-items-center flex-wrap">
          <span class="rating-badge fs-6" id="restRating"><i class="bi bi-star-fill"></i> 4.5</span>
          <span class="text-white" id="restTime"><i class="bi bi-clock"></i> 30 mins</span>
          <span class="text-white" id="restCost"><i class="bi bi-currency-rupee"></i> 200 for two</span>
        </div>
      </div>
    </div>
  </div>

  <div class="container pb-5">
    <div class="filter-bar mb-4" id="categoryFilters"></div>
    <div class="row g-4" id="menuGrid"></div>
    <div id="noResults" class="empty-state d-none">
      <i class="bi bi-search"></i>
      <h5>No dishes found</h5>
      <p class="text-muted">Try another category</p>
    </div>
  </div>

  <a href="cart.html" class="btn btn-primary-custom position-fixed bottom-0 end-0 m-4 rounded-pill shadow d-flex align-items-center gap-2" style="z-index:100;">
    <i class="bi bi-cart3"></i> View Cart
    <span class="badge bg-white text-primary cart-count">0</span>
  </a>

  
  <!-- Item Detail Modal -->
  <div class="item-modal-overlay" id="itemModal" role="dialog" aria-modal="true">
    <div class="item-modal">
      <div class="item-modal-img-wrap">
        <button type="button" class="item-modal-close" id="itemModalClose" aria-label="Close">&times;</button>
        <img src="" alt="" class="item-modal-img" id="modalImg">
      </div>
      <div class="item-modal-body">
        <h4 class="fw-bold mb-1" id="modalName"></h4>
        <p class="text-muted small mb-2" id="modalCategory"></p>
        <p class="mb-3" id="modalDesc"></p>
        <div class="d-flex justify-content-between align-items-center">
          <span class="item-modal-price" id="modalPrice"></span>
          <span id="modalVeg"></span>
        </div>
        <div class="item-modal-actions">
          <button type="button" class="btn btn-primary-custom flex-grow-1" id="modalAddCart">
            <i class="bi bi-cart-plus"></i> Add to Cart
          </button>
          <button type="button" class="btn btn-outline-custom" id="modalCloseBtn">Close</button>
        </div>
      </div>
    </div>
  </div>

  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">&copy; 2026 FoodExpress. All rights reserved.</div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/script.js"></script>
  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const restId = parseInt(params.get('id') || '1', 10);
      const restaurant = window.RESTAURANTS[restId] || window.RESTAURANTS[1];

      document.getElementById('restName').textContent = restaurant.name;
      document.getElementById('breadcrumbName').textContent = restaurant.name;
      document.getElementById('restCuisine').textContent = restaurant.cuisine;
      document.getElementById('restRating').innerHTML = '<i class="bi bi-star-fill"></i> ' + restaurant.rating + ' (' + restaurant.reviews + ')';
      document.getElementById('restTime').innerHTML = '<i class="bi bi-clock"></i> ' + restaurant.time;
      document.getElementById('restCost').innerHTML = '<i class="bi bi-currency-rupee"></i> ' + restaurant.cost;
      document.title = restaurant.name + ' Menu - FoodExpress';

      let currentCategory = 'All';
      const filterBar = document.getElementById('categoryFilters');

      restaurant.categories.forEach(function (cat, idx) {
        const chip = document.createElement('span');
        chip.className = 'filter-chip' + (idx === 0 ? ' active' : '');
        chip.textContent = cat;
        chip.dataset.category = cat;
        chip.addEventListener('click', function () {
          filterBar.querySelectorAll('.filter-chip').forEach(function (c) { c.classList.remove('active'); });
          this.classList.add('active');
          currentCategory = this.dataset.category;
          renderMenu();
        });
        filterBar.appendChild(chip);
      });

      function renderMenu() {
        const grid = document.getElementById('menuGrid');
        const noResults = document.getElementById('noResults');
        const items = restaurant.menu.filter(function (item) {
          return currentCategory === 'All' || item.category === currentCategory;
        });

        if (items.length === 0) {
          grid.innerHTML = '';
          noResults.classList.remove('d-none');
          return;
        }
        noResults.classList.add('d-none');

        grid.innerHTML = items.map(function (item, idx) {
          return '<div class="col-md-6 col-lg-4">' +
            '<div class="menu-card menu-card-clickable" data-idx="' + idx + '" style="cursor:pointer;">' +
              '<img src="' + item.image + '" alt="' + item.name + '" class="menu-img-real" ' +
                   'onerror="this.src=\'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=400&q=80\'">' +
              '<div class="menu-body">' +
                '<h6 class="menu-name">' +
                  '<span class="' + (item.veg ? 'veg-indicator' : 'nonveg-indicator') + '"></span> ' +
                  item.name +
                '</h6>' +
                '<p class="menu-desc">' + item.desc + '</p>' +
                '<div class="menu-footer">' +
                  '<span class="menu-price">₹' + item.price + '</span>' +
                  '<button class="btn-add btn-add-cart" ' +
                    'data-id="' + item.id + '" ' +
                    'data-name="' + item.name + '" ' +
                    'data-price="' + item.price + '" ' +
                    'data-image="' + item.image + '" ' +
                    'data-restaurant="' + restaurant.name + '">' +
                    '<i class="bi bi-plus-lg"></i>' +
                  '</button>' +
                '</div>' +
              '</div>' +
            '</div>' +
          '</div>';
        }).join('');

        // Open modal when card is clicked (not the + button)
        grid.querySelectorAll('.menu-card-clickable').forEach(function (card) {
          card.addEventListener('click', function (e) {
            if (e.target.closest('.btn-add-cart')) return;
            var idx = parseInt(this.dataset.idx, 10);
            openItemModal(items[idx]);
          });
        });

        grid.querySelectorAll('.btn-add-cart').forEach(function (btn) {
          btn.addEventListener('click', function (e) {
            e.preventDefault();
            e.stopPropagation();
            if (!window.Cart) return;
            Cart.addItem({
              id: this.dataset.id,
              name: this.dataset.name,
              price: parseFloat(this.dataset.price),
              image: this.dataset.image || '',
              restaurant: this.dataset.restaurant || '',
              qty: 1
            });
          });
        });
      }


      // Item detail modal
      var modal = document.getElementById('itemModal');
      var currentModalItem = null;

      function openItemModal(item) {
        currentModalItem = item;
        document.getElementById('modalImg').src = item.image;
        document.getElementById('modalImg').alt = item.name;
        document.getElementById('modalName').textContent = item.name;
        document.getElementById('modalCategory').textContent = item.category + ' · ' + restaurant.name;
        document.getElementById('modalDesc').textContent = item.desc;
        document.getElementById('modalPrice').textContent = '₹' + item.price;
        document.getElementById('modalVeg').innerHTML = item.veg
          ? '<span class="badge bg-success">Vegetarian</span>'
          : '<span class="badge bg-danger">Non-Vegetarian</span>';
        modal.classList.add('open');
        document.body.classList.add('modal-open');
      }

      function closeItemModal() {
        modal.classList.remove('open');
        document.body.classList.remove('modal-open');
        currentModalItem = null;
      }

      document.getElementById('itemModalClose').addEventListener('click', closeItemModal);
      document.getElementById('modalCloseBtn').addEventListener('click', closeItemModal);
      modal.addEventListener('click', function (e) {
        if (e.target === modal) closeItemModal();
      });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') closeItemModal();
      });
      document.getElementById('modalAddCart').addEventListener('click', function () {
        if (!currentModalItem || !window.Cart) return;
        Cart.addItem({
          id: currentModalItem.id,
          name: currentModalItem.name,
          price: currentModalItem.price,
          image: currentModalItem.image,
          restaurant: restaurant.name,
          qty: 1
        });
        closeItemModal();
      });

      renderMenu();
    })();
  </script>
</body>
</html>
