<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart - FoodExpress</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg">
    <div class="container">
      <a class="navbar-brand" href="home.html">
        <span class="logo-icon"><i class="bi bi-basket2-fill"></i></span>
        FoodExpress
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-1">
          <li class="nav-item"><a class="nav-link" href="home.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="restaurants.html">Restaurants</a></li>
          <li class="nav-item">
            <a class="nav-link cart-badge active" href="cart.html">
              <i class="bi bi-cart3"></i> Cart
              <span class="badge rounded-pill cart-count">0</span>
            </a>
          </li>
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">
              <i class="bi bi-person-circle"></i> <span class="user-name">User</span>
            </a>
            <ul class="dropdown-menu dropdown-menu-end">
              <li><a class="dropdown-item" href="profile.html">Profile</a></li>
              <li><a class="dropdown-item" href="index.html">Logout</a></li>
            </ul>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="page-header">
    <div class="container">
      <h1><i class="bi bi-cart3"></i> Your Cart</h1>
    </div>
  </div>

  <div class="container pb-5">
    <div class="row">
      <div class="col-lg-8" id="cartItems">
        <!-- Cart items rendered by JS -->
      </div>
      <div class="col-lg-4">
        <div class="cart-summary" id="cartSummary">
          <h5 class="fw-bold mb-3">Order Summary</h5>
          <div class="summary-row">
            <span>Item Total</span>
            <span id="subtotal">₹0</span>
          </div>
          <div class="summary-row">
            <span>Delivery Fee</span>
            <span id="deliveryFee">₹40</span>
          </div>
          <div class="summary-row">
            <span>Taxes & Charges</span>
            <span id="taxes">₹0</span>
          </div>
          <div class="summary-row summary-total">
            <span>Grand Total</span>
            <span id="grandTotal">₹0</span>
          </div>
          <a href="checkout.html" class="btn btn-primary-custom w-100 mt-3 py-2" id="checkoutBtn">Proceed to Checkout</a>
          <a href="restaurants.html" class="btn btn-outline-custom w-100 mt-2">Continue Shopping</a>
        </div>
      </div>
    </div>
  </div>

  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">&copy; 2026 FoodExpress. All rights reserved.</div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/script.js"></script>
  <script>
    function renderCart() {
      const container = document.getElementById('cartItems');
      const items = Cart.getItems();
      if (items.length === 0) {
        container.innerHTML = `
          <div class="empty-state bg-white rounded-3 shadow-sm">
            <i class="bi bi-cart-x"></i>
            <h5>Your cart is empty</h5>
            <p class="text-muted">Looks like you haven't added anything yet.</p>
            <a href="restaurants.html" class="btn btn-primary-custom">Browse Restaurants</a>
          </div>`;
        document.getElementById('subtotal').textContent = '₹0';
        document.getElementById('taxes').textContent = '₹0';
        document.getElementById('grandTotal').textContent = '₹0';
        document.getElementById('checkoutBtn').classList.add('disabled');
        return;
      }
      document.getElementById('checkoutBtn').classList.remove('disabled');
      let html = '';
      items.forEach(item => {
        html += `
          <div class="cart-item">
            <img src="${item.image || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=200&q=80'}" alt="${item.name}" class="cart-item-img" style="width:80px;height:80px;object-fit:cover;border-radius:8px;" onerror="this.src='https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=200&q=80'">
            <div class="flex-grow-1">
              <h6 class="mb-1 fw-semibold">${item.name}</h6>
              <p class="small text-muted mb-1">${item.restaurant || 'Restaurant'}</p>
              <div class="d-flex align-items-center justify-content-between">
                <span class="fw-bold text-primary">₹${item.price}</span>
                <div class="qty-control">
                  <button class="qty-btn" data-id="${item.id}" data-action="dec">−</button>
                  <span class="fw-semibold">${item.qty}</span>
                  <button class="qty-btn" data-id="${item.id}" data-action="inc">+</button>
                </div>
              </div>
            </div>
            <button class="btn btn-sm text-danger" onclick="Cart.removeItem('${item.id}'); renderCart();">
              <i class="bi bi-trash"></i>
            </button>
          </div>`;
      });
      container.innerHTML = html;

      // Re-bind qty buttons
      container.querySelectorAll('.qty-btn').forEach(btn => {
        btn.addEventListener('click', function () {
          const id = this.dataset.id;
          const action = this.dataset.action;
          const items = Cart.getItems();
          const item = items.find(i => i.id === id);
          if (!item) return;
          if (action === 'inc') Cart.updateQty(id, item.qty + 1);
          else Cart.updateQty(id, item.qty - 1);
          renderCart();
        });
      });

      const subtotal = Cart.getTotal();
      const delivery = subtotal > 0 ? 40 : 0;
      const taxes = Math.round(subtotal * 0.05);
      const total = subtotal + delivery + taxes;
      document.getElementById('subtotal').textContent = '₹' + subtotal;
      document.getElementById('deliveryFee').textContent = '₹' + delivery;
      document.getElementById('taxes').textContent = '₹' + taxes;
      document.getElementById('grandTotal').textContent = '₹' + total;
    }

    document.addEventListener('DOMContentLoaded', renderCart);
    window.addEventListener('cartUpdated', renderCart);
  </script>
</body>
</html>
