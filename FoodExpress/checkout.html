<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - FoodExpress</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg">
    <div class="container">
      <a class="navbar-brand" href="home.html">
        <span class="logo-icon"><i class="bi bi-basket2-fill"></i></span>
        FoodExpress
      </a>
      <div class="ms-auto">
        <a href="cart.html" class="nav-link"><i class="bi bi-arrow-left"></i> Back to Cart</a>
      </div>
    </div>
  </nav>

  <div class="page-header">
    <div class="container">
      <h1><i class="bi bi-credit-card"></i> Checkout</h1>
    </div>
  </div>

  <div class="container pb-5">
    <form id="checkoutForm" class="needs-validation" novalidate>
      <div class="row">
        <div class="col-lg-8">
          <!-- Delivery Address -->
          <div class="checkout-section">
            <h5 class="fw-bold mb-3"><i class="bi bi-geo-alt text-primary"></i> Delivery Address</h5>
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label">Full Name</label>
                <input type="text" class="form-control form-control-custom" required value="John Doe">
              </div>
              <div class="col-md-6">
                <label class="form-label">Phone</label>
                <input type="tel" class="form-control form-control-custom" required value="+91 98765 43210">
              </div>
              <div class="col-12">
                <label class="form-label">Address</label>
                <textarea class="form-control form-control-custom" rows="2" required>123, Green Park, Near Metro Station</textarea>
              </div>
              <div class="col-md-4">
                <label class="form-label">City</label>
                <input type="text" class="form-control form-control-custom" required value="New Delhi">
              </div>
              <div class="col-md-4">
                <label class="form-label">State</label>
                <input type="text" class="form-control form-control-custom" required value="Delhi">
              </div>
              <div class="col-md-4">
                <label class="form-label">Pincode</label>
                <input type="text" class="form-control form-control-custom" required value="110016">
              </div>
            </div>
          </div>

          <!-- Payment Method -->
          <div class="checkout-section">
            <h5 class="fw-bold mb-3"><i class="bi bi-wallet2 text-primary"></i> Payment Method</h5>
            <div class="payment-option selected">
              <input type="radio" name="payment" id="cod" value="cod" checked>
              <label for="cod"><i class="bi bi-cash-coin me-2"></i> Cash on Delivery</label>
            </div>
            <div class="payment-option">
              <input type="radio" name="payment" id="upi" value="upi">
              <label for="upi"><i class="bi bi-phone me-2"></i> UPI (GPay, PhonePe, Paytm)</label>
            </div>
            <div class="payment-option">
              <input type="radio" name="payment" id="card" value="card">
              <label for="card"><i class="bi bi-credit-card me-2"></i> Credit / Debit Card</label>
            </div>
            <div class="payment-option">
              <input type="radio" name="payment" id="wallet" value="wallet">
              <label for="wallet"><i class="bi bi-wallet me-2"></i> FoodExpress Wallet</label>
            </div>
          </div>
        </div>

        <div class="col-lg-4">
          <div class="cart-summary">
            <h5 class="fw-bold mb-3">Order Summary</h5>
            <div id="checkoutItems"></div>
            <hr>
            <div class="summary-row">
              <span>Item Total</span>
              <span id="cSubtotal">₹0</span>
            </div>
            <div class="summary-row">
              <span>Delivery Fee</span>
              <span>₹40</span>
            </div>
            <div class="summary-row">
              <span>Taxes</span>
              <span id="cTaxes">₹0</span>
            </div>
            <div class="summary-row summary-total">
              <span>To Pay</span>
              <span id="cTotal">₹0</span>
            </div>
            <button type="submit" class="btn btn-primary-custom w-100 mt-3 py-2">
              <i class="bi bi-lock-fill"></i> Place Order
            </button>
          </div>
        </div>
      </div>
    </form>
  </div>

  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">&copy; 2026 FoodExpress. All rights reserved.</div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/script.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const items = Cart.getItems();
      const container = document.getElementById('checkoutItems');
      if (items.length === 0) {
        window.location.href = 'cart.html';
        return;
      }
      let html = '';
      items.forEach(i => {
        html += `<div class="d-flex justify-content-between small mb-2">
          <span>${i.name} × ${i.qty}</span>
          <span>₹${i.price * i.qty}</span>
        </div>`;
      });
      container.innerHTML = html;
      const sub = Cart.getTotal();
      const tax = Math.round(sub * 0.05);
      document.getElementById('cSubtotal').textContent = '₹' + sub;
      document.getElementById('cTaxes').textContent = '₹' + tax;
      document.getElementById('cTotal').textContent = '₹' + (sub + 40 + tax);
    });
  </script>
</body>
</html>
