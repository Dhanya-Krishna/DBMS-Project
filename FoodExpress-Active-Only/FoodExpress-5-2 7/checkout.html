<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - FoodExpress</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg">
    <div class="container">
      <a class="navbar-brand" href="home.html">
        <span class="logo-icon"><i class="bi bi-basket2-fill"></i></span>
        FoodExpress
      </a>
      <div class="ms-auto">
        <a href="cart.html" class="nav-link"><i class="bi bi-arrow-left"></i> Back to Cart</a>
      </div>
    </div>
  </nav>

  <div class="page-header page-header-checkout">
    <div class="container">
      <h1><i class="bi bi-credit-card"></i> Checkout</h1>
    </div>
  </div>

  <div class="container pb-5">
    <form id="checkoutForm" class="needs-validation" novalidate>
      <div class="row checkout-layout">
        <div class="col-lg-8">
          <!-- Delivery Address -->
          <div class="checkout-section">
            <h5 class="fw-bold mb-3"><i class="bi bi-geo-alt text-primary"></i> Delivery Address</h5>
            
            <div id="savedAddressContainer" class="mb-3 d-none">
              <label class="form-label fw-semibold mb-2">Previously Used Addresses</label>
              <div id="addressOptionsList" class="d-flex flex-column gap-2 mb-3"></div>
            </div>

            <div id="manualAddressForm">
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label">Full Name</label>
                  <input type="text" id="checkoutName" class="form-control form-control-custom" placeholder="Your Full Name" required>
                </div>
                <div class="col-md-6">
                  <label class="form-label">Phone</label>
                  <input type="tel" id="checkoutPhone" class="form-control form-control-custom" placeholder="Your Phone Number" required>
                </div>
                <div class="col-12">
                  <label class="form-label">Address / Street</label>
                  <textarea id="checkoutStreet" class="form-control form-control-custom" rows="2" placeholder="e.g. 12 MG Road, Near City Mall" required></textarea>
                </div>
                <div class="col-md-4">
                  <label class="form-label">City</label>
                  <input type="text" id="checkoutCity" class="form-control form-control-custom" placeholder="e.g. Bengaluru" required>
                </div>
                <div class="col-md-4">
                  <label class="form-label">State</label>
                  <input type="text" id="checkoutState" class="form-control form-control-custom" placeholder="e.g. Karnataka" required>
                </div>
                <div class="col-md-4">
                  <label class="form-label">Pincode</label>
                  <input type="text" id="checkoutPincode" class="form-control form-control-custom" placeholder="e.g. 560001" required>
                </div>
              </div>
            </div>
          </div>

          <!-- Payment Method -->
          <div class="checkout-section">
            <h5 class="fw-bold mb-3"><i class="bi bi-wallet2 text-primary"></i> Payment Method</h5>
            <div class="payment-option selected">
              <input type="radio" name="payment" id="cod" value="cod" checked>
              <label for="cod"><i class="bi bi-cash-coin me-2"></i> Cash on Delivery</label>
            </div>
            <div class="payment-option">
              <input type="radio" name="payment" id="upi" value="upi">
              <label for="upi"><i class="bi bi-phone me-2"></i> UPI (GPay, PhonePe, Paytm)</label>
            </div>
            <div class="payment-option">
              <input type="radio" name="payment" id="card" value="card">
              <label for="card"><i class="bi bi-credit-card me-2"></i> Credit / Debit Card</label>
            </div>
            <div class="payment-option">
              <input type="radio" name="payment" id="wallet" value="wallet">
              <label for="wallet"><i class="bi bi-wallet me-2"></i> FoodExpress Wallet</label>
            </div>
          </div>
        </div>

        <div class="col-lg-4">
          <div class="cart-summary">
            <h5 class="fw-bold mb-3">Order Summary</h5>
            <div id="checkoutItems"></div>
            <hr>
            <div class="summary-row">
              <span>Item Total</span>
              <span id="cSubtotal">₹0</span>
            </div>
            <div class="summary-row">
              <span>Delivery Fee</span>
              <span id="cDeliveryFee">₹40</span>
            </div>
            <div class="summary-row">
              <span>Taxes (5%)</span>
              <span id="cTaxes">₹0</span>
            </div>
            <div class="mb-3">
              <label class="form-label small">Coupon</label>
              <div class="input-group input-group-sm">
                <input type="text" id="couponCode" class="form-control" placeholder="SAVE50">
                <button type="button" class="btn btn-outline-custom" id="applyCouponBtn">Apply</button>
              </div>
              <div id="couponMsg" class="small text-muted mt-1"></div>
            </div>
            <div class="summary-row text-success d-none" id="discountRow"><span>Discount</span><span id="cDiscount">−₹0</span></div>
            <div class="summary-row summary-total">
              <span>To Pay</span>
              <span id="cTotal">₹0</span>
            </div>
            <button type="submit" class="btn btn-primary-custom w-100 mt-3 py-2">
              <i class="bi bi-lock-fill"></i> Place Order
            </button>
          </div>
        </div>
      </div>
    </form>
  </div>

  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">&copy; 2026 FoodExpress. All rights reserved.</div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/script.js"></script>
  <script src="js/db.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      // ========== REQUIRE LOGIN TO PLACE ORDER ==========
      let user = {};
      try { user = JSON.parse(localStorage.getItem('foodexpress_user') || '{}'); } catch {}
      if (!user.email) {
        window.location.href = 'login.html?msg=' + encodeURIComponent('Please login to place an order');
        return;
      }

      const nameInput = document.getElementById('checkoutName');
      const phoneInput = document.getElementById('checkoutPhone');
      const streetInput = document.getElementById('checkoutStreet');
      const cityInput = document.getElementById('checkoutCity');
      const stateInput = document.getElementById('checkoutState');
      const pinInput = document.getElementById('checkoutPincode');
      const addressSelect = document.getElementById('addressSelect'); // optional — removed from UI

      if (nameInput && user.name) nameInput.value = user.name;
      if (phoneInput && user.phone) phoneInput.value = user.phone;

      let savedAddresses = [];
      let selectedAddressId = null;

      function fillAddressFields(addr) {
        if (!addr) return;
        selectedAddressId = addr.addressid;
        if (streetInput) streetInput.value = addr.street || '';
        if (cityInput) cityInput.value = addr.city || '';
        if (stateInput) stateInput.value = addr.landmark || addr.state || '';
        if (pinInput) pinInput.value = addr.pincode || '';
      }

      // Fetch customer & address details from DB
      try {
        for (let i = 0; i < 20 && !window.supabaseClient; i++) {
          await new Promise(r => setTimeout(r, 100));
        }
        if (window.DB && user.email) {
          const customer = await DB.findCustomerByEmail(user.email);
          if (customer) {
            if (nameInput && customer.name) nameInput.value = customer.name;
            if (phoneInput && customer.phone) phoneInput.value = customer.phone;

            const list = await DB.getCustomerAddresses(customer.customerid).catch(() => []);
            savedAddresses = (list || []).filter(a => {
              const s = (a.street || '').toLowerCase().trim();
              return s && s !== 'default address' && !s.startsWith('default address');
            });

            const savedContainer = document.getElementById('savedAddressContainer');
            const optionsList = document.getElementById('addressOptionsList');

            if (savedAddresses.length > 0 && savedContainer && optionsList) {
              savedContainer.classList.remove('d-none');
              let optionsHtml = '';
              savedAddresses.forEach((addr, idx) => {
                const isChecked = idx === 0 ? 'checked' : '';
                const displayCity = addr.city || '';
                const displayLandmark = addr.landmark ? ' (' + addr.landmark + ')' : '';
                const displayPin = addr.pincode ? ' - ' + addr.pincode : '';
                optionsHtml += `
                  <div class="border rounded p-3 bg-light address-card">
                    <div class="form-check m-0">
                      <input class="form-check-input ms-0 me-2" type="radio" name="addressChoice" id="addr_${addr.addressid}" value="${addr.addressid}" ${isChecked}>
                      <label class="form-check-label fw-medium w-100" for="addr_${addr.addressid}" style="cursor:pointer;">
                        <div class="fw-bold">${addr.street}</div>
                        <div class="small text-muted">${displayCity}${displayLandmark}${displayPin}</div>
                      </label>
                    </div>
                  </div>
                `;
              });

              optionsHtml += `
                <div class="border rounded p-3 bg-light address-card">
                  <div class="form-check m-0">
                    <input class="form-check-input ms-0 me-2" type="radio" name="addressChoice" id="addr_new" value="new">
                    <label class="form-check-label fw-medium text-primary w-100" for="addr_new" style="cursor:pointer;">
                      <i class="bi bi-plus-circle me-1"></i> Type a new delivery address
                    </label>
                  </div>
                </div>
              `;

              optionsList.innerHTML = optionsHtml;
              fillAddressFields(savedAddresses[0]);

              optionsList.querySelectorAll('input[name="addressChoice"]').forEach(radio => {
                radio.addEventListener('change', function () {
                  if (this.value === 'new') {
                    selectedAddressId = null;
                    if (streetInput) streetInput.value = '';
                    if (cityInput) cityInput.value = '';
                    if (stateInput) stateInput.value = '';
                    if (pinInput) pinInput.value = '';
                    if (streetInput) streetInput.focus();
                  } else {
                    const found = savedAddresses.find(a => String(a.addressid) === String(this.value));
                    if (found) {
                      fillAddressFields(found);
                    }
                  }
                });
              });
            } else {
              // 1st order: No pre-filled or default address, user enters manually
              if (savedContainer) savedContainer.classList.add('d-none');
              selectedAddressId = null;
              if (streetInput) streetInput.value = '';
              if (cityInput) cityInput.value = '';
              if (stateInput) stateInput.value = '';
              if (pinInput) pinInput.value = '';
            }
          }
        }
      } catch (err) {
        console.warn('DB address prefill error:', err);
      }

      const items = Cart.getItems();
      const container = document.getElementById('checkoutItems');
      if (items.length === 0) {
        window.location.href = 'cart.html';
        return;
      }

      // Group cart by restaurant to calculate delivery fees and order breakdown
      const byRest = {};
      items.forEach(i => {
        const rName = i.restaurant || 'Restaurant';
        if (!byRest[rName]) byRest[rName] = [];
        byRest[rName].push(i);
      });

      const restCount = Object.keys(byRest).length;
      const totalDeliveryFee = restCount > 1 ? (restCount * 40) : 40;

      let html = '';
      Object.entries(byRest).forEach(([rName, rItems]) => {
        html += `<div class="fw-bold small text-primary mt-2 mb-1"><i class="bi bi-shop me-1"></i> ${rName}</div>`;
        rItems.forEach(i => {
          html += `<div class="d-flex justify-content-between small mb-1 ps-2">
            <span>${i.name} × ${i.qty}</span>
            <span>₹${i.price * i.qty}</span>
          </div>`;
        });
      });
      if (container) container.innerHTML = html;

      const sub = Cart.getTotal();
      const tax = Math.round(sub * 0.05);
      const cSub = document.getElementById('cSubtotal');
      const cTax = document.getElementById('cTaxes');
      const cFee = document.getElementById('cDeliveryFee');
      const cTot = document.getElementById('cTotal');
      if (cSub) cSub.textContent = '₹' + sub;
      if (cFee) cFee.textContent = '₹' + totalDeliveryFee + (restCount > 1 ? ` (${restCount} kitchens)` : '');
      if (cTax) cTax.textContent = '₹' + tax;
      if (cTot) cTot.textContent = '₹' + (sub + totalDeliveryFee + tax);

      const form = document.getElementById('checkoutForm');
      if (form) {
        form.addEventListener('submit', async function (e) {
          e.preventDefault();
          e.stopPropagation();
          if (!form.checkValidity()) {
            form.classList.add('was-validated');
            return;
          }

          let u = {};
          try { u = JSON.parse(localStorage.getItem('foodexpress_user') || '{}'); } catch {}
          if (!u.email) {
            window.location.href = 'login.html?msg=' + encodeURIComponent('Please login to place an order');
            return;
          }

          const btn = form.querySelector('button[type="submit"]');
          if (btn) { btn.disabled = true; btn.textContent = 'Placing order...'; }

          try {
            for (let i = 0; i < 20 && !window.supabaseClient; i++) {
              await new Promise(r => setTimeout(r, 100));
            }

            let customer = await DB.findCustomerByEmail(u.email);
            if (!customer) {
              localStorage.removeItem('foodexpress_user');
              window.location.href = 'login.html?msg=' + encodeURIComponent('Your account was not found in database. Please register or login first.');
              return;
            }

            const enteredName = nameInput?.value?.trim() || customer.name;
            const enteredPhone = phoneInput?.value?.trim() || customer.phone;
            const enteredStreet = streetInput?.value?.trim() || '';
            const enteredCity = cityInput?.value?.trim() || '';
            const enteredState = stateInput?.value?.trim() || '';
            const enteredPincode = pinInput?.value?.trim() || '';
            if (!enteredStreet || !enteredCity || !enteredPincode) {
              alert('Please enter your full delivery address (street, city and pincode).');
              if (btn) { btn.disabled = false; btn.textContent = 'Place Order'; }
              return;
            }

            await DB.updateCustomer(customer.customerid, { name: enteredName, phone: enteredPhone });

            let finalAddressId = selectedAddressId;
            if (!finalAddressId) {
              const newAddr = await DB.addCustomerAddress({
                customerId: customer.customerid,
                street: enteredStreet,
                city: enteredCity,
                pincode: enteredPincode,
                landmark: enteredState || '',
                isdefault: false
              });
              if (newAddr && newAddr.addressid) {
                finalAddressId = newAddr.addressid;
              } else if (newAddr && newAddr[0] && newAddr[0].addressid) {
                finalAddressId = newAddr[0].addressid;
              }
            } else {
              // Update address if customer modified fields
              await DB.updateCustomerAddress(finalAddressId, {
                street: enteredStreet,
                city: enteredCity,
                pincode: enteredPincode,
                landmark: enteredState || ''
              }).catch(() => {});
            }

            if (!finalAddressId) {
              alert('Could not save delivery address. Please try again.');
              if (btn) { btn.disabled = false; btn.textContent = 'Place Order'; }
              return;
            }

            const methodEl = document.querySelector('input[name="payment"]:checked');
            const paymentMethod = methodEl ? methodEl.value : 'UPI';


        // Block if any restaurant in cart is paused
        try {
          const cartItems = (window.Cart && Cart.getItems()) ? Cart.getItems() : [];
          const restIds = [...new Set(cartItems.map(i => i.restaurantId).filter(Boolean))];
          for (const rid of restIds) {
            const r = await DB.getRestaurant(rid);
            if (r && (r.isactive === false || r.isactive === 0)) {
              alert((r.name || 'A restaurant') + ' is not accepting orders right now. Please remove their items from your cart.');
              return;
            }
          }
        } catch (e) { console.warn('pause check', e); }
            const result = await DB.placeOrder({
              customerId: customer.customerid,
              addressId: finalAddressId,
              cartItems: Cart.getItems(),
              paymentMethod
            });

            Cart.clear();

            const orderIds = (result.orders && result.orders.length)
              ? result.orders.map(o => o.orderid)
              : [result.combined ? result.combined.combinedorderid : 1];

            const joinedIds = orderIds.join(',');
            localStorage.setItem('foodexpress_last_order', joinedIds);
            window.location.href = 'order_tracking.html?order=' + encodeURIComponent(joinedIds);
          } catch (err) {
            console.error(err);
            alert('Order failed: ' + (err.message || err));
            if (btn) { btn.disabled = false; btn.textContent = 'Place Order'; }
          }
        }, true);
      }
    });
  </script>

  <script>
    let appliedDiscount = 0;
    document.getElementById('applyCouponBtn')?.addEventListener('click', async () => {
      const msg = document.getElementById('couponMsg');
      try {
        for (let i=0;i<20 && !window.DB;i++) await new Promise(r=>setTimeout(r,100));
        const coupon = await DB.validateCoupon(document.getElementById('couponCode').value);
        if (!coupon) { msg.textContent = 'Invalid coupon'; appliedDiscount=0; return; }
        const sub = (window.Cart && Cart.getTotal()) || 0;
        if (coupon.discounttype === 'percent') appliedDiscount = Math.round(sub * (coupon.discountvalue/100));
        else appliedDiscount = Math.round(coupon.discountvalue || 0);
        document.getElementById('discountRow')?.classList.remove('d-none');
        document.getElementById('cDiscount').textContent = '−₹' + appliedDiscount;
        msg.className = 'small text-success mt-1';
        msg.textContent = 'Applied −₹' + appliedDiscount;
      } catch(e) { msg.textContent = e.message||e; }
    });
  </script>

</body>
</html>
